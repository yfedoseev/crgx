[package]
name = "crgx"
version = "0.1.1"
edition = "2024"
description = "Run any crate binary instantly — fetch, cache, and execute without cargo install"
license = "MIT"
repository = "https://github.com/yfedoseev/crgx"
homepage = "https://crgx.dev"
documentation = "https://crgx.dev/docs"
readme = "README.md"
keywords = ["cargo", "binary", "runner", "npx", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "socks-proxy", "win-system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
flate2 = "1"
tar = "0.4"
zip = "8"
liblzma = "0.4"
thiserror = "2"
dirs = "7"
semver = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
