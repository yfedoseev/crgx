[package]
name = "crgx"
version = "0.1.0"
edition = "2024"
description = "npx/uvx for Rust — download and run Rust binaries in one command"
license = "MIT"
repository = "https://github.com/yfedoseev/crgx"
homepage = "https://crgx.dev"
documentation = "https://crgx.dev/docs"
readme = "README.md"
keywords = ["cargo", "binary", "runner", "npx", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
flate2 = "1"
tar = "0.4"
zip = "2"
xz2 = "0.1"
thiserror = "2"
anyhow = "1"
dirs = "6"
semver = "1"
dialoguer = "0.12"
url = "2"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
mockito = "1"
tempfile = "3"
